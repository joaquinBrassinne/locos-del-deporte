name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: locos_deporte
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: locos1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d locos_deporte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Newman: backend real + colección de tests/postman -------------------------------

      - name: Compilar el backend
        run: mvn -B -ntp -f Backend/pom.xml -DskipTests package

      # application.properties ya apunta a localhost:5432/locos_deporte (postgres / locos1234),
      # igual que el service container, y crea el admin AdminRoot / locos1234 al iniciar.
      - name: Levantar el backend
        run: |
          jar=$(ls Backend/target/*.jar | head -n 1)
          nohup java -Duser.timezone=UTC -jar "$jar" > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/clubes || true)
            if [ "$code" = "200" ]; then echo "Backend listo"; exit 0; fi
            sleep 2
          done
          echo "El backend no respondió en 120 s"
          tail -n 50 backend.log
          exit 1

      # TC-AU-05 y TC-AU-10 esperan la BD con DS-01 (plan de pruebas v1.1).
      - name: Cargar datos de prueba DS-01
        run: node tests/postman/seed-ds01.js

      - name: Ejecutar la colección de Newman
        run: |
          npm install -g newman@6 newman-reporter-htmlextra@1
          mkdir -p tests/postman/reports
          newman run tests/postman/CrazySports.postman_collection.json \
            -e tests/postman/entorno-local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export tests/postman/reports/reporte.html

      - name: Detener el backend
        if: always()
        run: pkill -f 'Backend.*\.jar' || true

      # --- JUnit + JaCoCo ---------------------------------------------------------------------

      - name: Ejecutar los tests de JUnit (Testcontainers + JaCoCo)
        if: always()
        run: mvn -B -ntp -f Backend/pom.xml clean test

      # El pom define testFailureIgnore=true, así que `mvn test` termina OK aunque haya tests
      # rojos. Este paso lee los reportes de Surefire y falla el job si hay failures o errors.
      - name: Fallar si algún test de JUnit falló
        if: always()
        run: |
          reports=$(ls Backend/target/surefire-reports/TEST-*.xml 2>/dev/null || true)
          if [ -z "$reports" ]; then
            echo "No hay reportes de Surefire: los tests no se ejecutaron"
            exit 1
          fi
          total=$(grep -h '<testsuite ' $reports | grep -oE ' tests="[0-9]+"' | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          failed=$(grep -h '<testsuite ' $reports | grep -oE ' (failures|errors)="[0-9]+"' | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "JUnit: $total tests, $failed con failure/error"
          if [ "$failed" -gt 0 ]; then
            grep -l -E '<(failure|error) ' $reports
            exit 1
          fi

      # --- Artifacts (siempre, aunque falle algún test) ---------------------------------------

      - name: Subir reporte HTML de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/postman/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir reportes de Surefire y log del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-surefire-y-backend-log
          path: |
            Backend/target/surefire-reports/
            backend.log
          if-no-files-found: ignore
          retention-days: 14

      # Playwright: no hay tests E2E todavía. Si se agregan, este paso sube el reporte, los trace
      # y los videos (por defecto Playwright los deja en playwright-report/ y test-results/).
      - name: Subir reportes de Playwright (si existen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            Frontend/playwright-report/
            Frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
